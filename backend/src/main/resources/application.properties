spring.application.name=home-stock-backend

# Database — env vars injected by Render in production, local fallback for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# SSL for Neon cloud database (ignored when running locally)
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:disable}
spring.datasource.hikari.data-source-properties.ssl=${DB_SSL:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port — Render injects PORT automatically
server.port=${PORT:8080}
spring.sql.init.mode=never
